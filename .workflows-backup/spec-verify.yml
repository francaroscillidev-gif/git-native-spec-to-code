name: Spec-to-Code Formal Verification

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'src/**'
  workflow_dispatch:

jobs:
  verify-and-heal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Spec-to-Code Agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx tsx src/cli/index.ts verify --spec examples/rate-limiter/spec.md --target-dir ./examples/rate-limiter/verified

      - name: Comment PR with Safety Attestation Report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './examples/rate-limiter/verified/VERIFICATION_REPORT.md';
            if (fs.existsSync(path)) {
              const content = fs.readFileSync(path, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: content
              });
            }
