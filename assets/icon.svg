<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="35%" stop-color="#bc8cff"/>
      <stop offset="70%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <!-- Shield Inner Fill -->
    <linearGradient id="shieldInner" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glowing Core Accent -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#56d364"/>
    </linearGradient>

    <!-- Quantum Ring Accent -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Circle/Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- Subtle Verification Orbit Rings -->
  <ellipse cx="256" cy="250" rx="180" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6, 8" transform="rotate(-25 256 250)"/>
  <ellipse cx="256" cy="250" rx="180" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6, 8" transform="rotate(35 256 250)"/>

  <!-- Master Aegis Shield Body -->
  <g filter="url(#softShadow)">
    <!-- Outer Shield Crest -->
    <path d="M 256 75 
             C 345 75 405 105 405 105 
             C 405 260 350 365 256 425 
             C 162 365 107 260 107 105 
             C 107 105 167 75 256 75 Z"
          fill="url(#shieldInner)"
          stroke="url(#shieldBorder)"
          stroke-width="7"
          stroke-linejoin="round"/>

    <!-- Subtle Inner Border -->
    <path d="M 256 95 
             C 330 95 385 120 385 120 
             C 385 248 338 342 256 395 
             C 174 342 127 248 127 120 
             C 127 120 182 95 256 95 Z"
          fill="none"
          stroke="#58a6ff"
          stroke-width="1.5"
          stroke-opacity="0.3"/>
  </g>

  <!-- Central Verification & Git Topology -->
  <g filter="url(#neonGlow)">
    <!-- Git Branch Line Left -->
    <path d="M 195 190 Q 230 240 256 240" fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round"/>
    <!-- Git Branch Line Right -->
    <path d="M 317 190 Q 282 240 256 240" fill="none" stroke="#bc8cff" stroke-width="5" stroke-linecap="round"/>
    <!-- Git Main Trunk Line -->
    <path d="M 256 240 L 256 320" fill="none" stroke="#3fb950" stroke-width="5" stroke-linecap="round"/>

    <!-- Git Commit Nodes -->
    <!-- Node Left (Spec Contract) -->
    <circle cx="195" cy="190" r="14" fill="#0d1117" stroke="#58a6ff" stroke-width="5"/>
    <circle cx="195" cy="190" r="5" fill="#58a6ff"/>

    <!-- Node Right (PBT Invariant) -->
    <circle cx="317" cy="190" r="14" fill="#0d1117" stroke="#bc8cff" stroke-width="5"/>
    <circle cx="317" cy="190" r="5" fill="#bc8cff"/>

    <!-- Central Fusion Core (Self-Healing Synthesis) -->
    <circle cx="256" cy="240" r="18" fill="#161b22" stroke="#2ea043" stroke-width="6"/>
    <circle cx="256" cy="240" r="8" fill="#3fb950"/>

    <!-- Bottom Verified Release Node -->
    <circle cx="256" cy="320" r="15" fill="#0d1117" stroke="#3fb950" stroke-width="5"/>
    <circle cx="256" cy="320" r="6" fill="#56d364"/>

    <!-- Radiant Mathematical Delta Checkmark -->
    <path d="M 232 240 L 248 256 L 285 215"
          fill="none"
          stroke="#ffffff"
          stroke-width="4.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Formal Verification Mathematical Symbols Overlay (Subtle) -->
  <text x="256" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#f0f6fc" text-anchor="middle" letter-spacing="3">SPEC ➔ CODE</text>
  <text x="256" y="365" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" fill="#7ee787" text-anchor="middle" font-weight="bold" letter-spacing="1.5">VERIFIED 100% • Q.E.D.</text>

  <!-- Corner Status Pips -->
  <circle cx="64" cy="64" r="5" fill="#58a6ff" opacity="0.4"/>
  <circle cx="448" cy="64" r="5" fill="#bc8cff" opacity="0.4"/>
  <circle cx="64" cy="448" r="5" fill="#2ea043" opacity="0.4"/>
  <circle cx="448" cy="448" r="5" fill="#3fb950" opacity="0.4"/>
</svg>
